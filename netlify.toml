# Sitio estático: no hay paso de compilación, se publica la raíz del repo tal cual.
[build]
  publish = "."
  command = ""

# Solo se sirven los archivos del panel (no el README ni archivos de configuración del repo).
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
